{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login V1</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->
	<link rel="icon" type="image/png" href="{% static 'assets/login/images/favicon.ico' %}"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:200,300,400,500,600,700,800&display=swap">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'assets/login/css/bootstrap.min.css' %}">
<!--===============================================================================================-->
	<!-- <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css"> -->
	<link rel="stylesheet" type="text/css" href="{% static 'assets/fa/css/all.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'assets/login/css/animate.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'assets/login/css/hamburgers.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'assets/login/css/select2.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'assets/login/css/util.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'assets/login/css/main.css' %}">
<!--===============================================================================================-->
<meta name="robots" content="noindex, follow">
</head>
<body>

	<div class="limiter">
        <!-- <div class="bg-primary-dark welcome-section">
            <img src="{% static 'assets/img/img/logo-light.png' %}" alt="Logo" width="200" />
            <h2>Welcome to Taxanomoly</h2>
            <p>
               Log in to explore your dashboard and get started.
            </p>
        </div> -->
		<div class="container-login100" style="background-image: url({% static 'assets/img/login-bg.jpg' %}); background-size: cover; transform: rotate(180deg);">
			<div class="wrap-login100" style="background-image: url({% static 'assets/img/login-bg.jpg' %}); background-size: cover; box-shadow: 10px 9px 12px; transform: rotate(180deg);">
				<form class="login100-form validate-form" action="{% url 'login' %}" method="POST">
                    {% csrf_token %}
					<span class="login100-form-title">
                        <img src="{% static 'assets/img/img/logo-light.png' %}" alt="Logo" style="width: 40%;" />
                        <!-- <h4 style="font-weight: bold;">Welcome to Risk Analysis & Benchmarking System - RABS</h4> -->
                         <br />
						<small class="text-light">Member Login</small>
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Valid email is required: ex@abc.xyz">
						<input class="input100" name="email" id="inputEmail" type="email" placeholder="name@example.com" />
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-envelope" aria-hidden="true"></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" name="password" id="inputPassword" placeholder="Password">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>

					<div class="container-login100-form-btn">
						<button class="login100-form-btn">
							Login
						</button>
					</div>

					<div class="text-center p-t-12">
						<span class="txt1">
							Forgot
						</span>
						<a class="txt2" href="#">
							Username / Password?
						</a>
					</div>
                    {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger {{ message.tags|default:'alert-danger' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    {% endfor %}
                    {% endif %}
					<div class="text-center p-t-136">
						<a class="txt2" href="#">
							<!-- Create your Account
							<i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i> -->
						</a>
					</div>
				</form>
				<div class="login100-pic js-tilt" data-tilt style="display: none;">
					<img src="{% static 'assets/login/images/img-01.png' %}" alt="IMG">
				</div>
			</div>
		</div>
	</div>




<!--===============================================================================================-->
	<script src="{% static 'assets/login/js/jquery-3.2.1.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'assets/login/js/popper.js' %}"></script>
	<script src="{% static 'assets/login/js/bootstrap.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'assets/login/js/select2.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'assets/login/js/tilt.jquery.min.js' %}"></script>
	<script >
		$('.js-tilt').tilt({
			scale: 1.1
		})
	</script>

<!--===============================================================================================-->
    <script src="{% static 'assets/login/js/main.js' %}"></script>
</body>
</html>
